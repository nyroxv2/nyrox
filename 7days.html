<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NYROX — 7 Days</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="background-grid"></div>

<div class="overlay"></div>

<!-- Sidebar -->

<div class="sidebar">

<h2>NYROX</h2>

<a href="index.html">🏠 Home</a>

<a href="dashboard.html">🎯 Challenges</a>

<a href="7days.html">🔥 7 Days</a>

<a href="analytics.html">📊 Analytics</a>

<a href="settings.html">⚙️ Settings</a>

</div>


<!-- Header -->

<header class="header">

<div class="logo">

<h1>NYROX</h1>

<p>7 Days Challenge</p>

</div>

<button class="menu-btn">
☰
</button>

</header>


<!-- 7 Days Dashboard -->

<main class="daily-page">

<div class="page-heading">

<span class="badge">
7 DAYS CHALLENGE
</span>

<h2>
DAY <span id="currentDay">01</span>
</h2>

<p>
Stay focused. Complete today's targets.
</p>

</div>


<!-- Progress -->

<section class="progress-card">

<div class="progress-top">

<span>Today's Progress</span>

<span id="progressPercent">0%</span>

</div>

<div class="progress-bar">

<div
class="progress-fill"
id="progressFill">
</div>

</div>

</section>


<!-- Week Tracker -->

<section class="week-tracker-card">

<h3>WEEK TRACKER</h3>

<div class="week-tracker">

<div class="day active">MON</div>

<div class="day">TUE</div>

<div class="day">WED</div>

<div class="day">THU</div>

<div class="day">FRI</div>

<div class="day">SAT</div>

<div class="day">SUN</div>

</div>

</section>


<!-- Info -->

<section class="info-card">

<div class="info-item">

<label>Date</label>

<input type="date" id="targetDate">

</div>


<div class="info-item">

<label>Day</label>

<input
type="text"
id="dayName"
placeholder="Day 1">

</div>


<div class="info-item">

<label>Streak 🔥</label>

<input
type="number"
id="streak"
value="1"
min="0">

</div>

</section>


<!-- Target Sheet -->

<section class="target-sheet">

<h2>DAILY TARGET SHEET</h2>


<h3>This Week's Anchor</h3>

<input
type="text"
class="full-input"
id="weeklyAnchor"
placeholder="Example: No Excuses. Stay Consistent.">


<h3>Today's #1 Priority</h3>

<input
type="text"
class="full-input"
id="topPriority"
placeholder="Most Important Task Today">


<h3>Today's Targets</h3>


<div id="taskList">


<div class="target-row">

<input
type="text"
placeholder="Target 1"
class="task-input">

<select class="task-status">

<option>Pending</option>

<option>Done</option>

<option>Partial</option>

<option>Missed</option>

</select>

</div>


<div class="target-row">

<input
type="text"
placeholder="Target 2"
class="task-input">

<select class="task-status">

<option>Pending</option>

<option>Done</option>

<option>Partial</option>

<option>Missed</option>

</select>

</div>


<div class="target-row">

<input
type="text"
placeholder="Target 3"
class="task-input">

<select class="task-status">

<option>Pending</option>

<option>Done</option>

<option>Partial</option>

<option>Missed</option>

</select>

</div>


</div>


<button
class="challenge-btn"
id="addTask">

+ Add Target

</button>



</section>


<!-- Save -->

<button
class="save-btn"
id="saveProgress">

Save Progress

</button>


</main>


<script src="script.js"></script>

</body>

</html>
